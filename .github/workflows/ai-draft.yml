# BASH OS — Content Studio draft agent.
# Label an issue `ai-draft` → Claude scaffolds + outlines + drafts a post,
# then opens a PR for human review. It NEVER pushes to main and NEVER
# auto-merges: a new post is customer-facing (Yellow), so a human must approve.
# The post is created with `published: false` and a hard gate asserts it stays
# that way, so nothing can go live from this workflow.
name: ai-draft

on:
  issues:
    types: [labeled]

# Only react to the ai-draft label.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft:
    if: github.event.label.name == 'ai-draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the bashos CLI
        run: |
          cd tools/bashos
          npm install
          npm run build

      - name: Pick subfolder from a content:* label (default tech)
        id: route
        env:
          LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          sub=$(echo "$LABELS" | grep -oE 'content:(corp|erp|muses|tech)' | head -1 | cut -d: -f2)
          echo "subfolder=${sub:-tech}" >> "$GITHUB_OUTPUT"

      - name: Scaffold, outline, and draft the post
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TITLE: ${{ github.event.issue.title }}
          SUBFOLDER: ${{ steps.route.outputs.subfolder }}
        run: |
          set -euo pipefail
          BASHOS="node tools/bashos/dist/index.js"
          FILE=$($BASHOS content new --subfolder "$SUBFOLDER" --title "$TITLE")
          echo "Created $FILE"
          $BASHOS content outline "$FILE" --write --tier sonnet
          $BASHOS content stage "$FILE" drafting
          $BASHOS content draft "$FILE" --write --tier sonnet
          $BASHOS content stage "$FILE" review
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Safety gate — post must remain published:false and schema-valid
        env:
          FILE: ${{ steps.draft.outputs.file }}
        run: |
          set -euo pipefail
          if ! grep -qE '^published:\s*false\s*$' "$FILE"; then
            echo "::error::Draft is not published:false — refusing to open a PR that could go live."
            exit 1
          fi
          node tools/bashos/evals/validate-prompts.mjs

      - name: Open a PR for review (never auto-merged)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ai/draft-${{ github.event.issue.number }}
          base: main
          commit-message: |
            content(draft): AI draft for "${{ github.event.issue.title }}" (#${{ github.event.issue.number }})

            Scaffolded and drafted by the BASH OS Content Studio draft agent.
            stage: review · published: false (not live). Requires human review.
          title: "AI draft: ${{ github.event.issue.title }}"
          labels: ai-draft, needs-review
          body: |
            Automated draft for #${{ github.event.issue.number }}, generated by the Content Studio draft agent.

            - **Stage:** `review` · **`published: false`** (build-excluded, not live)
            - **Classification:** 🟡 Yellow — customer-facing once published. **Do not auto-merge.**
            - Review for voice (`content-style.instructions.md`), accuracy, and any `TODO`/invented-fact placeholders before promoting with `bashos content stage <file> published`.

            Closes #${{ github.event.issue.number }} when merged and published.
