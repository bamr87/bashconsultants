  role: "Founder and solutions architect, BASH Consulting"
  tagline: "Enterprise-grade IT for small business — cloud, ERP, data, and AI-augmented automation, from Denver, Colorado"
  bio: >-
    Solutions architect with a finance and IT background — ERP, financial
    systems, and data work for manufacturers and growing businesses. Through
    BASH Consulting he brings that enterprise-grade work to businesses that
    cannot justify a big-firm engagement, and teaches the people inside them
    to run their own systems.
  location: "Denver, CO"
  avatar: "https://bash-365.com/assets/images/Amr-Headshot_v2.jpg"
  github: "bamr87"
  linkedin: "amrabdel"
  website: "https://bash-365.com/about/amr/"
  expertise:
    - "ERP implementations"
    - "Financial system design"
    - "Business intelligence reporting"
    - "System integrations"
    - "Cloud architecture"

