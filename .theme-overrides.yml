# =============================================================================
# .theme-overrides.yml — the theme files this site intentionally forks
# =============================================================================
#
# This site consumes bamr87/zer0-mistakes (pinned in _config.yml). Any file
# kept here that also exists in the theme SHADOWS the theme's copy. The theme's
# auditor classifies each one:
#
#   IDENTICAL            byte-for-byte the theme's copy → delete it
#   DIFFERS_JUSTIFIED    differs AND listed below → intentional, no action
#   DIFFERS_UNJUSTIFIED  differs and NOT listed below → flagged as drift
#   UNIQUE               exists only here → our own file, ignored
#
# Run from a theme checkout:
#   ./scripts/bin/audit-consumer --consumer-path /path/to/bashconsultants
#   ./scripts/bin/audit-consumer --consumer-path /path/to/bashconsultants --strict
#
# Keep the `reason` honest and current. An override whose reason has been fixed
# upstream is the signal to delete the fork and take the theme's version back —
# that is what the `upstream:` field records.
#
# Deliberately NOT listed:
#   * _includes/{contact,contact-methods,structured-data}.html — no theme
#     counterpart; UNIQUE files of our own.
#   * _data/** and _plugins/** — Jekyll never loads either from a theme, so a
#     same-named file there shadows nothing; ours is the only copy that runs.
#   * Root project files (README.md, _config.yml, .gitignore, package.json, …)
#     — every Jekyll site has them; sharing a name with the theme repo's own
#     copy is not a fork.
# =============================================================================

overrides:
  - path: "_layouts/landing.html"
    reason: >-
      Bespoke marketing homepage: particles hero, services grid rendered from
      _data/entity/services.yml, plus industries / process / AI-practice /
      stats / FAQ sections driven by index.md front matter. Replaces the
      theme's generic _data/landing.yml-driven template entirely.

  - path: "_includes/analytics/google-tag-manager-head.html"
    reason: >-
      Deliberate no-op stub. Google Tag Manager is disabled site-wide for
      privacy — PostHog is the sole analytics tool — and the theme's version
      loads a hardcoded GTM container in production.

  - path: "_includes/analytics/posthog.html"
    reason: >-
      Privacy hardening the pinned theme cannot express: initializes opted out
      with memory-only persistence until the cookie banner records analytics
      consent, honors Global Privacy Control alongside Do Not Track, and
      disables PostHog IP geolocation. This is what /privacy/ promises readers.
    upstream: >-
      Upstreamed in theme v1.28.0 as posthog.privacy.{respect_gpc,
      require_consent, geoip_disable}; _config.yml already sets all three.
      Delete this fork once remote_theme is bumped from v1.26.0 to >= v1.28.0
      (and Gemfile.azure with it) — not before, or capture-before-consent and
      IP geolocation come back silently.

  - path: "assets/images/wizard-on-journey.png"
    reason: >-
      Our own homepage / Open Graph image (index.md `preview:`), which happens
      to share a filename with an unrelated theme mascot asset. Same path,
      different picture — not a fork of the theme's file.
